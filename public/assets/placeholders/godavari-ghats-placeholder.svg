<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" role="img" aria-label="Godavari Riverfront and Ghats Placeholder Graphic">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="50%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#sunsetGrad)"/>
  <!-- Ahilyabai Bridge Arches in Distance -->
  <path d="M0 210 Q 60 180 120 210 Q 180 180 240 210 Q 300 180 360 210 Q 420 180 480 210 Q 540 180 600 210 L 600 220 L 0 220 Z" fill="#64748B"/>
  <rect x="0" y="200" width="600" height="10" fill="#475569"/>
  <!-- River Water Body -->
  <rect x="0" y="220" width="600" height="160" fill="url(#riverGrad)"/>
  <!-- Left River Ghat Steps -->
  <polygon points="0,220 180,380 0,380" fill="#CBD5E1"/>
  <polygon points="0,240 160,380 0,380" fill="#94A3B8"/>
  <polygon points="0,270 130,380 0,380" fill="#64748B"/>
  <!-- Deepstambha (Lantern Pillar) Silhouette on Ghat -->
  <rect x="40" y="160" width="12" height="110" fill="#334155"/>
  <polygon points="46,140 38,160 54,160" fill="#D97706"/>
  <circle cx="46" cy="138" r="6" fill="#F59E0B"/>
  <!-- Floating Evening Deepa (Earthen lamps) in Godavari -->
  <circle cx="280" cy="270" r="4" fill="#F59E0B"/>
  <circle cx="340" cy="300" r="5" fill="#EA580C"/>
  <circle cx="420" cy="280" r="4" fill="#F59E0B"/>
  <circle cx="490" cy="320" r="4" fill="#FBBF24"/>
  <!-- Caption Overlays -->
  <rect x="20" y="20" width="310" height="42" rx="6" fill="#0C2340" opacity="0.9"/>
  <text x="32" y="38" font-family="'Noto Sans Devanagari', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">गोदावरी महाआरती व विस्तीर्ण घाट</text>
  <text x="32" y="52" font-family="'Noto Sans', sans-serif" font-size="9.5" fill="#CBD5E1">Photo placeholder - Godavari Riverfront</text>
  <rect x="390" y="335" width="190" height="28" rx="4" fill="#000000" opacity="0.65"/>
  <text x="400" y="353" font-family="'Noto Sans', sans-serif" font-size="9.5" fill="#F8FAFC">Source: Nashik Tourism Bureau</text>
</svg>
