<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" role="img" aria-label="Ramkund Sacred Ghats Placeholder Graphic">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Background / Sky -->
  <rect width="600" height="380" fill="url(#skyGrad)"/>
  <!-- Distant Sun / Aura -->
  <circle cx="300" cy="110" r="48" fill="#FDE047" opacity="0.6"/>
  <!-- Temple Silhouette -->
  <path d="M260 210 L280 130 L300 90 L320 130 L340 210 Z" fill="#78350F" opacity="0.85"/>
  <rect x="296" y="70" width="8" height="20" fill="#B45309"/>
  <!-- Kalash & Flag on Shikhara -->
  <path d="M304 70 L325 80 L304 90 Z" fill="#EA580C"/>
  <path d="M210 210 L225 150 L245 150 L255 210 Z" fill="#92400E" opacity="0.75"/>
  <path d="M345 210 L355 160 L375 160 L390 210 Z" fill="#92400E" opacity="0.75"/>
  <!-- Stone Ghat Steps -->
  <polygon points="0,210 600,210 600,270 0,270" fill="#CBD5E1"/>
  <polygon points="0,230 600,230 600,235 0,235" fill="#94A3B8"/>
  <polygon points="0,250 600,250 600,255 0,255" fill="#94A3B8"/>
  <polygon points="0,270 600,270 600,380 0,380" fill="url(#waterGrad)"/>
  <!-- Godavari Water Ripple Lines -->
  <path d="M30 290 Q 150 280 300 290 T 570 290" stroke="#BAE6FD" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M20 320 Q 180 310 330 320 T 580 320" stroke="#E0F2FE" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M40 350 Q 220 340 380 350 T 560 350" stroke="#BAE6FD" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Center Bathing Kund Border Graphic -->
  <rect x="180" y="240" width="240" height="90" rx="6" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-dasharray="8 4"/>
  <!-- Official Placeholder Overlay Banner -->
  <rect x="20" y="20" width="280" height="42" rx="6" fill="#0C2340" opacity="0.9"/>
  <text x="32" y="38" font-family="'Noto Sans Devanagari', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">पवित्र रामकुंड स्नान घाट (नाशिक)</text>
  <text x="32" y="52" font-family="'Noto Sans', sans-serif" font-size="9.5" fill="#CBD5E1">Photo placeholder - Sacred Godavari Basin</text>
  <rect x="390" y="335" width="190" height="28" rx="4" fill="#000000" opacity="0.65"/>
  <text x="400" y="353" font-family="'Noto Sans', sans-serif" font-size="9.5" fill="#F8FAFC">Source: Nashik Admin Geo-Cell</text>
</svg>
