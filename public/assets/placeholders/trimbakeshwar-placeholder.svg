  </defs>
  <rect width="600" height="380" fill="#FEF3C7"/>
  <!-- Brahmagiri Mountain Silhouette -->
  <path d="M0 220 Q 140 80 300 90 T 600 210 L 600 380 L 0 380 Z" fill="url(#brahmaGrad)"/>
  <path d="M60 220 Q 200 120 380 130 T 600 230 L 600 380 L 0 380 Z" fill="#1E293B" opacity="0.6"/>
