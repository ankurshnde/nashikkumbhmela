  <!-- Temple Pillars / Mandapa -->
  <rect x="220" y="240" width="160" height="30" fill="#1E293B"/>
  <!-- Kushavarta Reservoir -->
  <rect x="150" y="270" width="300" height="90" rx="8" fill="url(#kushWater)" stroke="#94A3B8" stroke-width="4"/>
  <rect x="170" y="280" width="260" height="70" rx="4" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 3"/>
