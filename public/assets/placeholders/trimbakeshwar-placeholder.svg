  <rect x="20" y="20" width="310" height="42" rx="6" fill="#0C2340" opacity="0.9"/>
  <text x="32" y="38" font-family="'Noto Sans Devanagari', 'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">कुशावर्त तीर्थ व त्र्यंबकेश्वर ज्योतिर्लिंग</text>
  <text x="32" y="52" font-family="'Noto Sans', sans-serif" font-size="9.5" fill="#CBD5E1">Photo placeholder - Brahmagiri Foothills</text>
  <rect x="390" y="335" width="190" height="28" rx="4" fill="#000000" opacity="0.65"/>
  <text x="400" y="353" font-family="'Noto Sans', sans-serif" font-size="9.5" fill="#F8FAFC">Source: NTKMA Planning Desk</text>
