<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" role="img" aria-label="Official Emblem of Nashik-Trimbakeshwar Simhastha Kumbh Mela 2027">
  <defs>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="sacredOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="riverBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (Kumbh / Kalash & Sacred Elements) -->
  <g transform="translate(10, 5)">
    <!-- Sunburst Halo -->
    <circle cx="50" cy="50" r="46" fill="#FEF3C7" stroke="url(#kalashGold)" stroke-width="2"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Godavari Holy Waves at Base -->
    <path d="M15 78 Q 30 70 50 78 T 85 78 L 85 88 Q 65 82 50 88 T 15 88 Z" fill="url(#riverBlue)"/>
    <path d="M20 84 Q 35 78 50 84 T 80 84" stroke="#BAE6FD" stroke-width="1.5" fill="none"/>

    <!-- Trishul / Lord Shiva Emblem (Trimbakeshwar) -->
    <path d="M50 12 L50 45" stroke="#C2410C" stroke-width="3"/>
    <path d="M42 22 Q 42 32 50 35 Q 58 32 58 22" fill="none" stroke="#C2410C" stroke-width="2.5"/>
    <polygon points="50,8 47,15 53,15" fill="#C2410C"/>
    <polygon points="42,18 39,24 45,24" fill="#C2410C"/>
    <polygon points="58,18 55,24 61,24" fill="#C2410C"/>

    <!-- Sacred Kalash (Vessel of Nectar) -->
    <ellipse cx="50" cy="45" rx="14" ry="4" fill="url(#kalashGold)"/>
    <path d="M36 45 C34 58 38 72 50 73 C62 72 66 58 64 45 Z" fill="url(#kalashGold)" stroke="#92400E" stroke-width="1"/>
    <!-- Swastika / Sacred Mark on Kalash -->
    <circle cx="50" cy="58" r="4" fill="#DC2626"/>
    <!-- Coconut & Mango Leaves on top -->
    <path d="M42 43 C40 35 48 30 50 30 C52 30 60 35 58 43 Z" fill="#15803D"/>
    <circle cx="50" cy="38" r="7" fill="#78350F"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(115, 0)">
    <!-- Small Official Hierarchy Tag -->
    <rect x="0" y="8" width="185" height="18" rx="3" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="6" y="21" font-family="'Noto Sans Devanagari', sans-serif" font-size="9" font-weight="700" fill="#92400E">महाराष्ट्र शासन • नाशिक जिल्हा प्रशासन</text>

    <!-- Main Title: Marathi Devanagari -->
    <text x="0" y="48" font-family="'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.2">नाशिक-त्र्यंबकेश्वर सिंहस्थ कुंभमेळा</text>

    <!-- Year Badge & English Subtitle -->
    <g transform="translate(0, 56)">
      <!-- Year Badge -->
      <rect x="0" y="5" width="56" height="22" rx="4" fill="url(#sacredOrange)"/>
      <text x="28" y="20" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">2027</text>

      <text x="66" y="16" font-family="'Noto Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE047" letter-spacing="0.8">SIMHASTHA MAHA KUMBH MELA</text>
      <text x="66" y="28" font-family="'Noto Sans', sans-serif" font-size="8.5" font-weight="500" fill="#CBD5E1">Nashik &amp; Trimbakeshwar Sacred Pilgrimage Hub</text>
    </g>
  </g>
</svg>
