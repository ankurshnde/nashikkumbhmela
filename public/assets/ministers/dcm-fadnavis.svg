<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="160" height="190" role="img" aria-label="Portrait of Hon'ble Deputy Chief Minister of Maharashtra">
  <defs>
    <linearGradient id="dcmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="blueJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="160" height="190" rx="10" fill="url(#dcmBg)"/>
  <rect x="0" y="0" width="160" height="6" fill="#1D4ED8"/>

  <g transform="translate(15, 20)">
    <!-- Blue Nehru Jacket over White Kurta -->
    <path d="M10 160 L120 160 C120 120 105 102 90 95 L84 102 L46 102 L40 95 C25 102 10 120 10 160 Z" fill="url(#blueJacket)"/>
    <path d="M52 97 L78 97 L75 130 L55 130 Z" fill="#FFFFFF"/>
    <line x1="65" y1="97" x2="65" y2="155" stroke="#F8FAFC" stroke-width="1.8"/>

    <!-- Neck -->
    <rect x="52" y="78" width="26" height="24" fill="#DDA07A"/>

    <!-- Head -->
    <ellipse cx="65" cy="56" rx="25" ry="28" fill="#DDA07A"/>

    <!-- Hair with side sweep -->
    <path d="M40 45 C40 24 50 18 65 18 C80 18 90 24 90 45 C86 28 75 22 65 22 C52 22 43 28 40 45 Z" fill="#1E293B"/>

    <!-- Eyebrows & Eyes -->
    <path d="M48 45 Q 54 42 60 45" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M70 45 Q 76 42 82 45" stroke="#1E293B" stroke-width="2" fill="none"/>
    <circle cx="54" cy="50" r="2.5" fill="#1E293B"/>
    <circle cx="76" cy="50" r="2.5" fill="#1E293B"/>

    <!-- Nose & Smile line -->
    <path d="M65 48 L65 58 L68 60" stroke="#B45309" stroke-width="1.5" fill="none"/>
    <path d="M54 67 Q 65 72 76 67" stroke="#78350F" stroke-width="2" fill="none"/>
    
    <!-- Red Tilak -->
    <path d="M63 36 L67 36 L65 42 Z" fill="#DC2626"/>
  </g>
</svg>
