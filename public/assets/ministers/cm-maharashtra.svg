<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="160" height="190" role="img" aria-label="Portrait of Hon'ble Chief Minister of Maharashtra">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="cmKurta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="160" height="190" rx="10" fill="url(#cmBg)"/>
  
  <!-- Subtle Saffron Gold Top Ribbon -->
  <rect x="0" y="0" width="160" height="6" fill="#D97706"/>

  <g transform="translate(15, 20)">
    <!-- White Kurta / Traditional Attire -->
    <path d="M10 160 L120 160 C120 120 105 102 90 95 L84 102 L46 102 L40 95 C25 102 10 120 10 160 Z" fill="url(#cmKurta)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Collar & Saffron Shawl / Uttariya -->
    <path d="M25 125 C25 105 40 98 48 102 L45 160 L20 160 Z" fill="#EA580C"/>
    <path d="M50 96 L80 96 L76 130 L54 130 Z" fill="#FFFFFF"/>
    <line x1="65" y1="96" x2="65" y2="145" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="52" y="78" width="26" height="24" fill="#DDA07A"/>

    <!-- Head -->
    <ellipse cx="65" cy="56" rx="24" ry="28" fill="#DDA07A"/>

    <!-- Black Hair with side parting -->
    <path d="M41 48 C41 24 50 18 65 18 C80 18 89 24 89 48 C85 28 75 22 65 22 C52 22 44 28 41 48 Z" fill="#1E293B"/>

    <!-- Red Tilak on Forehead (Chandrakor / Sacred Tilak) -->
    <path d="M62 38 Q 65 44 68 38 Q 65 41 62 38 Z" fill="#DC2626"/>
    <circle cx="65" cy="45" r="1.5" fill="#DC2626"/>

    <!-- Eyebrows & Eyes -->
    <path d="M48 45 Q 54 43 60 45" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M70 45 Q 76 43 82 45" stroke="#1E293B" stroke-width="2" fill="none"/>
    <circle cx="54" cy="50" r="2.5" fill="#1E293B"/>
    <circle cx="76" cy="50" r="2.5" fill="#1E293B"/>

    <!-- Mustache & Beard -->
    <path d="M43 54 C43 72 50 82 65 82 C80 82 87 72 87 54 C82 60 75 64 65 64 C55 64 48 60 43 54 Z" fill="#1E293B"/>
    <path d="M50 63 Q 65 66 80 63 Q 65 72 50 63 Z" fill="#0F172A"/>

    <!-- Specs / Glasses -->
    <rect x="47" y="45" width="15" height="11" rx="3" fill="none" stroke="#475569" stroke-width="1.8"/>
    <rect x="68" y="45" width="15" height="11" rx="3" fill="none" stroke="#475569" stroke-width="1.8"/>
    <line x1="62" y1="50" x2="68" y2="50" stroke="#475569" stroke-width="1.8"/>
    <line x1="41" y1="49" x2="47" y2="49" stroke="#475569" stroke-width="1.5"/>
    <line x1="83" y1="49" x2="89" y2="49" stroke="#475569" stroke-width="1.5"/>
  </g>
</svg>
