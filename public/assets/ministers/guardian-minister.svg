<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="160" height="190" role="img" aria-label="Portrait of Hon'ble Guardian Minister, Nashik District">
  <defs>
    <linearGradient id="gmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="maroonJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
  </defs>

  <rect width="160" height="190" rx="10" fill="url(#gmBg)"/>
  <rect x="0" y="0" width="160" height="6" fill="#9D174D"/>

  <g transform="translate(15, 20)">
    <!-- Maroon Official Bundi Jacket -->
    <path d="M10 160 L120 160 C120 120 105 102 90 95 L84 102 L46 102 L40 95 C25 102 10 120 10 160 Z" fill="url(#maroonJacket)"/>
    <path d="M52 97 L78 97 L75 130 L55 130 Z" fill="#FFFFFF"/>
    <line x1="65" y1="97" x2="65" y2="155" stroke="#FDE047" stroke-width="1.8"/>

    <!-- Neck -->
    <rect x="52" y="78" width="26" height="24" fill="#DDA07A"/>

    <!-- Head -->
    <ellipse cx="65" cy="56" rx="24" ry="28" fill="#DDA07A"/>

    <!-- Hair -->
    <path d="M41 45 C41 24 50 18 65 18 C80 18 89 24 89 45 C85 28 75 22 65 22 C52 22 43 28 41 45 Z" fill="#1E293B"/>

    <!-- Eyebrows & Eyes -->
    <path d="M48 45 Q 54 42 60 45" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M70 45 Q 76 42 82 45" stroke="#1E293B" stroke-width="2" fill="none"/>
    <circle cx="54" cy="50" r="2.5" fill="#1E293B"/>
    <circle cx="76" cy="50" r="2.5" fill="#1E293B"/>

    <!-- Moustache -->
    <path d="M52 64 Q 65 67 78 64 Q 65 70 52 64 Z" fill="#1E293B"/>
  </g>
</svg>
