<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Government of Maharashtra Official Seal">
  <defs>
    <linearGradient id="mahaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="100" cy="100" r="95" fill="url(#mahaRed)" stroke="url(#goldBorder)" stroke-width="6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Sacred Lamp (Deepa) at top -->
  <path d="M96 22 L104 22 L106 30 L94 30 Z" fill="url(#goldBorder)"/>
  <path d="M100 12 C103 16 104 18 100 22 C96 18 97 16 100 12 Z" fill="#FBBF24"/>

  <!-- Inner Octagonal Rajmudra Outline -->
  <polygon points="100,32 145,52 165,97 145,142 100,162 55,142 35,97 55,52" fill="#581C1C" stroke="url(#goldBorder)" stroke-width="2.5"/>

  <!-- Sanskrit Inscription of Chhatrapati Shivaji Maharaj Rajmudra in Devanagari -->
  <g fill="url(#goldBorder)" font-family="'Noto Sans Devanagari', 'Noto Sans', sans-serif" text-anchor="middle" font-weight="700">
    <text x="100" y="65" font-size="11">प्रतिपच्चंद्र-</text>
    <text x="100" y="82" font-size="11">लेखेव वर्धिष्णुर्वि-</text>
    <text x="100" y="99" font-size="11">श्ववंदिता शाहसूनोः</text>
    <text x="100" y="116" font-size="11">शिवस्यैषा मुद्रा</text>
    <text x="100" y="133" font-size="11">भद्राय राजते</text>
  </g>

  <!-- Bottom Label: महाराष्ट्र शासन -->
  <rect x="45" y="168" width="110" height="24" rx="4" fill="url(#goldBorder)"/>
  <text x="100" y="184" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="800" fill="#7F1D1D">महाराष्ट्र शासन</text>
</svg>
