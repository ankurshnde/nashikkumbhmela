<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="State Emblem of India">
  <defs>
    <linearGradient id="goldEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <!-- Sarnath Lions Capital Silhouette & Detailing -->
  <g fill="url(#goldEmblem)">
    <!-- Central Lion Head -->
    <path d="M80 20 C70 20 62 28 62 38 C62 46 66 52 70 56 C68 62 66 68 65 76 C70 77 75 76 80 74 C85 76 90 77 95 76 C94 68 92 62 90 56 C94 52 98 46 98 38 C98 28 90 20 80 20 Z"/>
    <circle cx="80" cy="38" r="4" fill="#78350F"/>
    <path d="M74 46 Q 80 50 86 46" stroke="#78350F" stroke-width="2" fill="none"/>
    <!-- Left Lion Head -->
    <path d="M52 32 C44 32 38 38 38 46 C38 52 42 57 46 60 C44 65 42 71 42 78 C47 79 52 78 56 76 C57 70 59 64 61 58 C56 55 52 49 52 43 Z"/>
    <!-- Right Lion Head -->
    <path d="M108 32 C116 32 122 38 122 46 C122 52 118 57 114 60 C116 65 118 71 118 78 C113 79 108 78 104 76 C103 70 101 64 99 58 C104 55 108 49 108 43 Z"/>
    <!-- Mane and Pedestal Structure -->
    <path d="M50 78 L110 78 L114 96 L46 96 Z"/>
    <!-- Ashoka Chakra on Abacus -->
    <circle cx="80" cy="116" r="16" fill="none" stroke="url(#goldEmblem)" stroke-width="3"/>
    <circle cx="80" cy="116" r="4" fill="url(#goldEmblem)"/>
    <!-- Chakra Spokes -->
    <line x1="80" y1="100" x2="80" y2="132" stroke="url(#goldEmblem)" stroke-width="1.5"/>
    <line x1="64" y1="116" x2="96" y2="116" stroke="url(#goldEmblem)" stroke-width="1.5"/>
    <line x1="69" y1="105" x2="91" y2="127" stroke="url(#goldEmblem)" stroke-width="1.5"/>
    <line x1="69" y1="127" x2="91" y2="105" stroke="url(#goldEmblem)" stroke-width="1.5"/>
    <!-- Galloping Horse (Left) & Bull (Right) representations -->
    <path d="M44 118 C40 114 36 118 36 122 C36 126 44 126 48 124 Z"/>
    <path d="M116 118 C120 114 124 118 124 122 C124 126 116 126 112 124 Z"/>
    <!-- Lotus Base -->
    <path d="M30 136 Q 80 148 130 136 L136 150 Q 80 160 24 150 Z"/>
    <path d="M40 152 Q 80 162 120 152 L124 162 Q 80 170 36 162 Z"/>
    <!-- Satyameva Jayate Calligraphy in Devanagari -->
    <text x="80" y="184" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Noto Sans', sans-serif" font-size="13" font-weight="800" fill="url(#goldEmblem)" letter-spacing="1">सत्यमेव जयते</text>
  </g>
